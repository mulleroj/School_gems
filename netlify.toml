# Netlify konfigurace pro GemForge
# Statický web – žádný build krok, soubory se nasazují přímo

[build]
  publish = "."

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/gem"
  to = "/gem.html"
  status = 301
  force = true
